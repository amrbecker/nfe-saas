# Render Blueprint — API do NfeSaas (WebUI fica na Cloudflare Pages, não aqui).
#
# Uso: conecte este repositório em https://dashboard.render.com/blueprints (New > Blueprint).
# O Render lê este arquivo, cria o serviço e pede para preencher as variáveis marcadas
# `sync: false` (secrets — nunca ficam neste arquivo nem no git).
#
# Free tier: sem disco persistente e o serviço "dorme" após ~15min sem tráfego (cold start no
# próximo request). Por isso: Database__MigrateOnStartup=true (só há 1 instância, sem risco de
# migrations concorrentes) e DataProtection cai automaticamente no fallback via Postgres
# (ver src/Infrastructure/DependencyInjection.cs) em vez de volume em disco.
services:
  - type: web
    name: nfesaas-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: WebUI__BaseUrl
        value: https://nfe.sideral.app.br
      - key: Jwt__Issuer
        value: NfeSaas
      - key: Jwt__Audience
        value: NfeSaas.WebUI
      - key: Database__MigrateOnStartup
        value: "true"
      # --- Secrets (preencher no dashboard do Render após criar o Blueprint) ---
      - key: ConnectionStrings__DefaultConnection
        sync: false # connection string do Neon — ver docs/deploy-producao.md
      - key: Jwt__Secret
        sync: false # openssl rand -base64 48
      - key: Sentry__Dsn
        sync: false # DSN do projeto "nfesaas-api" no Sentry (opcional, mas recomendado)
      - key: DataProtection__CertificateBase64
        sync: false # opcional — ver docs/deploy-producao.md "Cifrar as chaves de Data Protection"
      - key: DataProtection__CertificatePassword
        sync: false # obrigatório se CertificateBase64 estiver preenchido
      - key: Resend__ApiKey
        sync: false # opcional — só necessário quando algum fluxo de email for implementado
      - key: Resend__FromEmail
        sync: false # opcional
      # --- Ori (assistente) — ver docs/assistente/CONTRATOS_TECNICOS.md §5. Sem chave de IA, a Ori
      # funciona só com a base de conhecimento e as automações determinísticas.
      - key: Assistente__EscritoriosPiloto__0
        sync: false # opcional — preenchido = só esses escritórios veem a Ori (piloto)
      - key: Assistente__Ia__Conversa__Endpoint
        sync: false # DeepSeek no Microsoft Foundry (endpoint compatível com OpenAI, ex. https://<recurso>.services.ai.azure.com/openai/v1/)
      - key: Assistente__Ia__Conversa__ApiKey
        sync: false
      - key: Assistente__Ia__Conversa__Modelo
        sync: false # nome do deployment no Foundry
      - key: Assistente__Ia__FontesPublicas__Endpoint
        sync: false # opcional — API direta da DeepSeek (https://api.deepseek.com), SÓ dado público
      - key: Assistente__Ia__FontesPublicas__ApiKey
        sync: false
      - key: Assistente__EmailPo
        sync: false # relatório semanal de insights
      - key: Assistente__EmailCurador
        sync: false # resumo semanal da fila de curadoria (escritório parceiro)
      - key: Assistente__Inlabs__Email
        sync: false # opcional — conta do INLABS (DOU em XML); vazio = fonte DOU inativa
      - key: Assistente__Inlabs__Senha
        sync: false
