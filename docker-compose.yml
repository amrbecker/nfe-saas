version: '3.9'

# Copia do docker/docker-compose.yml na raiz para facilitar uso
# Execute: docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: nfesaas_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB obrigatório - copie .env.example para .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatório}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nfesaas_net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: nfesaas_api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:?};Username=${POSTGRES_USER:?};Password=${POSTGRES_PASSWORD:?}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET obrigatório - mínimo 32 caracteres}
      - Jwt__Issuer=${JWT_ISSUER:-NfeSaas}
      - Jwt__Audience=${JWT_AUDIENCE:-NfeSaas.WebUI}
      - WebUI__BaseUrl=${WEBUI_BASE_URL:-http://localhost:5002}
      # Data Protection — chaves de cifragem persistidas neste path (volume `dp_keys`).
      # Perder este volume invalida senha do certificado e CscToken já cifrados.
      - DataProtection__KeysPath=/app/dpkeys
      # NCM update worker — vazio = desativado. Configure conforme sua fonte oficial:
      #   Ncm__UpdateSourceUrl: URL HTTPS de um JSON no formato Portal Único Siscomex
      #   Ncm__LocalFilePath:   caminho dentro do container para um JSON local (ex.: volume montado)
      #   Ncm__UpdateIntervalDays: padrão 7
      #   Ncm__UpdateOnStartup:    padrão false
      - Ncm__UpdateSourceUrl=
      - Ncm__LocalFilePath=
      - Ncm__UpdateIntervalDays=7
      - Ncm__UpdateOnStartup=false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs
      - dp_keys:/app/dpkeys
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nfesaas_net

  webui:
    build:
      context: .
      dockerfile: docker/Dockerfile.webui
    container_name: nfesaas_webui
    ports:
      - "5002:80"
    depends_on:
      - api
    networks:
      - nfesaas_net

volumes:
  postgres_data:
  api_logs:
  dp_keys:

networks:
  nfesaas_net:
    driver: bridge
