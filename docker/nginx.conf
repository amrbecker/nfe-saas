server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem esse header, o Blazor WASM assume ambiente "Production" por padrão (não há
    # ASP.NET Core host aqui para detectar automaticamente) e passaria a ler
    # wwwroot/appsettings.Production.json — que aponta pra API real de produção. Isso quebraria
    # o docker-compose local (WebUI tentaria falar com a API de produção em vez do container
    # local). Fixamos "Development" aqui; hosts estáticos reais (Cloudflare Pages) não setam
    # esse header, então lá o default "Production" correto se aplica.
    add_header Blazor-Environment "Development" always;

    # Blazor WASM - SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|wasm|woff|woff2|ttf|png|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for index.html and Blazor boot manifest
    # (add_header não herda do server{} numa location que já define o seu — precisa repetir
    # Blazor-Environment aqui, senão o request pra "/" cai em try_files -> /index.html e perde o header)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Blazor-Environment "Development" always;
    }

    location = /_framework/blazor.boot.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Blazor-Environment "Development" always;
    }

    gzip on;
    gzip_types text/plain application/javascript application/x-javascript
               text/javascript text/css application/json application/wasm;
    gzip_min_length 1024;
}
