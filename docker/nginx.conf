server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem esse header, o Blazor WASM assume ambiente "Production" por padrão (não há
    # ASP.NET Core host aqui para detectar automaticamente) e passaria a ler
    # wwwroot/appsettings.Production.json — que aponta pra API real de produção. Isso quebraria
    # o docker-compose local (WebUI tentaria falar com a API de produção em vez do container
    # local). Fixamos "Development" aqui; hosts estáticos reais (Cloudflare Pages) não setam
    # esse header, então lá o default "Production" correto se aplica.
    add_header Blazor-Environment "Development" always;

    # Mesmo CSP de produção (src/WebUI/wwwroot/_headers), só com connect-src apontando pro
    # container local da API em vez de api.nfe.sideral.app.br. Sem isso localmente, um bug tipo
    # "script inline bloqueado pelo CSP" (ex.: window.downloadFile nunca definido — aconteceu em
    # produção 2026-09-10, invisível aqui até então) nunca reproduz em dev, só depois do deploy.
    # Usa uma variável (em vez de repetir a string) porque add_header não herda do server{} numa
    # location que já define o seu próprio add_header — precisa ser reafirmado em cada uma, e
    # "set" (diferente de add_header) herda normalmente.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:5001 https://viacep.com.br https://brasilapi.com.br; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;

    # Blazor WASM - SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy $csp always;
    }

    # Assets verdadeiramente estáticos (nome não muda entre builds)
    location ~* \.(woff|woff2|ttf|png|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
    }

    # .js/.css/.wasm/.dll/.dat/.pdb do Blazor WASM NÃO têm hash de conteúdo no nome (build a
    # build, NfeSaas.WebUI.wasm/MudBlazor.wasm etc. continuam com o mesmo nome) — cache
    # "immutable" nesses arquivos prende o navegador numa versão antiga do código até o cache
    # expirar, mesmo após um restart com código novo (mesmo bug corrigido em produção — ver
    # src/WebUI/wwwroot/_headers). "no-cache" ainda cacheia, mas sempre revalida via ETag.
    location ~* \.(js|css|wasm|dll|dat|pdb)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
    }

    # No cache for index.html and Blazor boot manifest
    # (add_header não herda do server{} numa location que já define o seu — precisa repetir
    # Blazor-Environment/CSP aqui, senão o request pra "/" cai em try_files -> /index.html e perde os headers)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Blazor-Environment "Development" always;
        add_header Content-Security-Policy $csp always;
    }

    location = /_framework/blazor.boot.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Blazor-Environment "Development" always;
        add_header Content-Security-Policy $csp always;
    }

    gzip on;
    gzip_types text/plain application/javascript application/x-javascript
               text/javascript text/css application/json application/wasm;
    gzip_min_length 1024;
}
